<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        width: 300px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0;
        padding: 10px 12px 6px;
      }
      p {
        margin: 0;
        padding: 0 12px 12px;
        color: #666;
        font-size: 12px;
      }
      .ver {
        padding: 0 12px 10px;
        font-size: 12px;
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>抓到 Excel</h1>
    <p class="ver">当前版本 v0.4.4。右侧白底卡片标题应为「取数 v0.4.4」，且不应闪烁。</p>
    <p><b>你现在看到的深蓝横条是旧脚本，改文件不会自动生效。</b></p>
    <p>1. chrome://extensions → 本扩展「重新加载」→ 报表页 Ctrl+Shift+R<br/>2. 若从 Excel 取数弹出窗口：任务窗格点「结束」，关掉跑 backend 的窗口，再启动一次，然后重新取数。</p>
  </body>
</html>
