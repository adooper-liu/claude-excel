key: ebay.listing
headerless: false
targets:
  - 标题
  - 售价
  - 成色
  - 运费
  - 卖家
  - 好评率
  - 已售
  - 链接
columns:
  - { as: 标题, from: title }
  - { as: 售价, from: price, coerce: number }
  - { as: 成色, from: condition }
  - { as: 运费, from: shipping }
  - { as: 卖家, from: sellerName }
  - { as: 好评率, from: positiveFeedbackInPercentage, coerce: number }
  - { as: 已售, from: soldQuantity, coerce: number }
  - { as: 链接, from: link }
